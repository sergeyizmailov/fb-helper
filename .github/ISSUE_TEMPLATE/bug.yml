name: Bug
description: Something does not work
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Extension version
      placeholder: 2.2.0
    validations:
      required: true
  - type: input
    id: chrome
    attributes:
      label: Chrome version
      placeholder: "121"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: markdown
    attributes:
      value: Never paste a token, cookies or account IDs. Blur them in screenshots.
