name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: manifest and syntax
        run: |
          node -e "const m=require('./manifest.json'); if(m.manifest_version!==3) process.exit(1); console.log(m.name, m.version)"
          for f in js/*.js; do node --input-type=module --check < "$f"; done
